<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>polyML viewer</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --text: #e6e8ee; --muted: #9aa1b2; --line: #2a2f3a; --accent: #8ab4ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  #app { display: flex; height: 100%; }
  #side { width: 300px; flex: none; overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 14px 16px; }
  #graph { flex: 1; position: relative; min-width: 0; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 6px; }
  .sub { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
  label.chk { display: flex; align-items: center; gap: 6px; padding: 2px 0; cursor: pointer; }
  .sw { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  button, .file { background: #232836; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; font: inherit; }
  button:hover, .file:hover { border-color: var(--accent); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  input[type=search] { width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: #10131a; color: var(--text); font: inherit; }
  input[type=range] { width: 100%; }
  #info { position: absolute; right: 12px; top: 12px; max-width: 280px; background: rgba(24,27,34,.95); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: none; }
  #info h3 { margin: 0 0 4px; font-size: 15px; }
  #info ul { margin: 6px 0 0; padding-left: 18px; }
  #drop { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(15,17,21,.85); font-size: 20px; border: 2px dashed var(--accent); }
  #err { color: #ff8a8a; font-size: 12px; white-space: pre-wrap; }
  .note { color: var(--muted); font-size: 12px; }
  @media (max-width: 700px) {
    #app { flex-direction: column; }
    #side { width: 100%; max-height: 45%; border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <h1>polyML viewer</h1>
    <p class="sub" id="doctitle">No file loaded</p>
    <div class="row">
      <label class="file">Open file…<input id="fileIn" type="file" accept=".json,application/json" hidden></label>
      <button id="sampleBtn">Sample</button>
      <button id="fitBtn">Fit</button>
    </div>
    <p class="note">You can also drop a file on the graph, or make one in the <a href="builder.html" style="color:var(--accent)">builder</a>.</p>
    <div id="err"></div>

    <h2>Search</h2>
    <input id="search" type="search" placeholder="Name, id or tag">

    <h2>Date</h2>
    <label class="chk"><input type="checkbox" id="useDate"> Show network as of</label>
    <input id="dateRange" type="range" min="0" max="0" value="0" disabled>
    <div class="note" id="dateLabel">Today (current status)</div>

    <h2>Status</h2><div id="f-status"></div>
    <h2>Relationship types</h2><div id="f-types"></div>
    <h2>Direction</h2><div id="f-dir"></div>
    <h2>Distance</h2><div id="f-dist"></div>
    <h2>Priority</h2><div id="f-prio"></div>
    <h2>Groups</h2><div id="f-groups"></div>

    <h2>Display</h2>
    <label class="chk"><input type="checkbox" id="showBonds" checked> Show group bonds (triads, quads)</label>
    <label class="chk"><input type="checkbox" id="showMeta"> Show metamours (thin grey lines)</label>
    <label class="chk"><input type="checkbox" id="hideIsolated"> Hide people with no visible links</label>
  </aside>
  <main id="graph"><div id="info"></div><div id="drop">Drop a .polyml.json file</div></main>
</div>

<script src="https://unpkg.com/3d-force-graph@1.73.4/dist/3d-force-graph.min.js"></script>
<script src="polyml.js"></script>
<script>
(() => {
  const P = window.PolyML;
  const PALETTE = ['#f472b6','#fb923c','#60a5fa','#a78bfa','#34d399','#facc15','#f87171','#22d3ee','#a3a3a3','#c084fc','#4ade80','#e879f9'];
  const STATUS_COLOR = { active: null, paused: '#9aa1b2', ended: '#5b6170', unknown: '#7c8496' };
  const NONE = '(none)', UNTYPED = '(untyped)';

  let doc = null, colorOf = {}, groupColor = {}, dates = [];
  const filters = { status: new Set(['active','paused','unknown']), types: new Set(), dir: new Set(), groups: new Set(), dist: new Set(), prio: new Set() };
  const $ = id => document.getElementById(id);

  const Graph = ForceGraph3D()($('graph'))
    .backgroundColor('#0f1115')
    .nodeLabel(n => `${esc(n.label)}${n.person.pronouns ? ' (' + esc(n.person.pronouns) + ')' : ''}`)
    .nodeColor(n => n.color)
    .nodeVal(n => 2 + n.deg * 1.5)
    .nodeOpacity(0.95)
    .linkColor(l => l.color)
    .linkWidth(l => l.width)
    .linkOpacity(0.7)
    .linkLabel(l => l.label)
    .linkDirectionalArrowLength(l => l.arrow ? 5 : 0)
    .linkDirectionalArrowRelPos(0.75)
    .linkDirectionalArrowColor(l => l.color)
    .linkDirectionalParticles(l => l.dir === 'both' ? 3 : 0)
    .linkDirectionalParticleWidth(1.5)
    .onNodeClick(focusNode)
    .onLinkClick(showLink)
    .onBackgroundClick(() => { $('info').style.display = 'none'; });
  // Link strength and width follow priority where it is given (never relationship type: spec §7).
  const PRIO_STRENGTH = { anchor: 1, primary: 0.8, secondary: 0.5, none: 0.3 };
  const PRIO_WIDTH = { anchor: 3, primary: 2.4, secondary: 1.6, none: 1 };
  Graph.d3Force('link').strength(l => PRIO_STRENGTH[l.priority] ?? 0.5);

  new ResizeObserver(() => Graph.width($('graph').clientWidth).height($('graph').clientHeight)).observe($('graph'));

  function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  const groupName = id => doc.groups.find(g => g.id === id)?.name || id;

  const DIRS = ['one-way', 'both', NONE];
  const dirKind = d => d === 'both' ? 'both' : d ? 'one-way' : NONE;
  const HIDDEN = '#9aa1b2';

  function load(json) {
    $('err').textContent = '';
    if (json && typeof json === 'object') json = P.upgrade(json);
    const problems = P.validate(json);
    const fatal = problems.find(p => /^(polyml|people|relationships)$|parties/.test(p.path) || p.path === '');
    if (fatal) { $('err').textContent = fatal.msg; return; }
    $('err').textContent = problems.length ? `This file has ${problems.length} problem(s), for example: ${problems[0].msg}` : '';
    doc = json;
    json.groups = json.groups || [];
    $('doctitle').textContent = json.meta?.title || 'Untitled network';

    // Types of obscured relationships never reach the filter list (spec §8).
    const bonds = [...json.relationships.filter(r => !P.isObscured(json, r)), ...json.groups];
    const vocabTypes = json.vocab?.relationship_types || [];
    const allTypes = bonds.flatMap(b => [...(b.types || []), ...(b.history || []).flatMap(h => h.types || [])]);
    const usedTypes = [...new Set([...P.CORE.relationship_types.filter(t => allTypes.includes(t)), ...vocabTypes.map(v => v.id), ...allTypes])];
    const hasUntyped = json.relationships.filter(r => !P.isObscured(json, r)).some(r => !r.types.length || (r.history || []).some(h => h.types && !h.types.length));
    colorOf = {};
    usedTypes.forEach((t, i) => colorOf[t] = vocabTypes.find(v => v.id === t)?.color || PALETTE[i % PALETTE.length]);
    groupColor = {};
    json.groups.forEach((g, i) => groupColor[g.id] = PALETTE[(i + 3) % PALETTE.length]);

    const typeItems = [...usedTypes, ...(hasUntyped ? [UNTYPED] : [])];
    filters.types = new Set(typeItems);
    filters.dir = new Set(DIRS);
    filters.groups = new Set([...json.groups.map(g => g.id), NONE]);
    filters.dist = new Set([...P.ENUMS.distance, NONE]);
    filters.prio = new Set([...P.ENUMS.priority, NONE]);

    buildChecks('f-status', P.ENUMS.status, filters.status, s => STATUS_COLOR[s] || '#e6e8ee');
    buildChecks('f-types', typeItems, filters.types, t => colorOf[t] || '#cbd5e1', t => t === UNTYPED ? 'No type (relationship anarchy)' : t);
    buildChecks('f-dir', DIRS, filters.dir, () => '#e6e8ee', d => ({ 'one-way': 'One way (arrow)', both: 'Both ways (switch)', [NONE]: 'Not given' })[d]);
    buildChecks('f-dist', [...P.ENUMS.distance, NONE], filters.dist, () => '#e6e8ee', d => d === NONE ? 'Not given' : d);
    buildChecks('f-prio', [...P.ENUMS.priority, NONE], filters.prio, () => '#e6e8ee', d => d === NONE ? 'Not given' : d);
    buildChecks('f-groups', [...json.groups.map(g => g.id), NONE], filters.groups, g => groupColor[g] || '#e6e8ee',
      g => g === NONE ? 'Not in a group' : groupName(g) + (json.groups.find(x => x.id === g)?.types?.length ? ' (bond)' : ''));

    dates = P.allDates(json);
    $('dateRange').max = Math.max(0, dates.length - 1);
    $('dateRange').value = $('dateRange').max;
    $('useDate').disabled = dates.length === 0;
    refresh();
    setTimeout(() => Graph.zoomToFit(600, 40), 800);
  }

  function buildChecks(el, items, set, colorFn, labelFn = x => x) {
    const host = $(el); host.innerHTML = '';
    if (!items.length) { host.innerHTML = '<div class="note">None in this file</div>'; return; }
    for (const it of items) {
      const lab = document.createElement('label'); lab.className = 'chk';
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = set.has(it);
      cb.onchange = () => { cb.checked ? set.add(it) : set.delete(it); refresh(); };
      const sw = document.createElement('span'); sw.className = 'sw'; sw.style.background = colorFn(it);
      lab.append(cb, sw, document.createTextNode(labelFn(it)));
      host.append(lab);
    }
  }

  function refresh() {
    if (!doc) return;
    const d = $('useDate').checked ? dates[+$('dateRange').value] : null;
    $('dateLabel').textContent = d ? d : 'Today (current status)';
    $('dateRange').disabled = !$('useDate').checked;
    const q = $('search').value.trim().toLowerCase();

    // Group membership as of the chosen date; colour each person by their most specific (deepest) group.
    const depth = id => { let n = 0, g = doc.groups.find(x => x.id === id); while (g?.parent && n < 20) { n++; g = doc.groups.find(x => x.id === g.parent); } return n; };
    const peopleGroups = {}, firstGroup = {};
    for (const g of doc.groups) for (const m of P.membersAt(g, d)) {
      (peopleGroups[m] ||= []).push(g.id);
      if (!firstGroup[m] || depth(g.id) > depth(firstGroup[m])) firstGroup[m] = g.id;
    }

    const nodes = new Map();
    for (const p of doc.people) {
      const gs = peopleGroups[p.id] || [NONE];
      if (!gs.some(g => filters.groups.has(g))) continue;
      const match = !q || [p.id, p.name, p.location, ...(p.tags || [])].some(s => s && String(s).toLowerCase().includes(q));
      nodes.set(p.id, { id: p.id, label: p.name, person: p, deg: 0, groups: gs,
        color: !match ? '#3a3f4b' : (groupColor[firstGroup[p.id]] || '#cbd5e1') });
    }

    const links = [];
    for (const r of doc.relationships) {
      const [a, b] = r.parties.map(x => x.person);
      if (!nodes.has(a) || !nodes.has(b)) continue;
      const st = P.statusAt(r, d);
      // Camera obscura (spec §8): an active link shows as a plain line; no filter but status touches it.
      if (P.isObscured(doc, r)) {
        if (st === 'active' && filters.status.has('active'))
          links.push({ source: a, target: b, rel: r, hidden: true, status: st, types: [], width: 1, color: HIDDEN, label: 'Details hidden (camera obscura)' });
        continue;
      }
      if (!st || !filters.status.has(st)) continue;
      const types = P.typesAt(r, d), dir = P.directionAt(r, d);
      if (!(types.length ? types : [UNTYPED]).some(t => filters.types.has(t))) continue;
      if (!filters.dir.has(dirKind(dir))) continue;
      const dist = P.distanceOf(r);
      if (!filters.dist.has(dist || NONE) || !filters.prio.has(r.priority || NONE)) continue;
      const ra = P.isAnarchic(doc, r);
      const titles = r.parties.filter(x => x.title || x.role).map(x => `${esc(nodes.get(x.person).label)}: ${esc([x.title, x.role].filter(Boolean).join(', '))}`);
      const facts = [st, dist, r.priority, r.contact && `${r.contact} contact`, ra && 'relationship anarchy'].filter(Boolean);
      const name = id => esc(nodes.get(id).label);
      const dirText = dir === 'both' ? 'switches both ways' : dir ? `${name(dir)} → ${name(dir === a ? b : a)}` : '';
      const one = dir && dir !== 'both';
      links.push({
        // A one-way link runs from the party the dynamic runs from, so the arrow points away from them.
        source: one && dir === b ? b : a, target: one && dir === b ? a : b,
        rel: r, status: st, types, dir, arrow: one, priority: r.priority,
        width: PRIO_WIDTH[r.priority] ?? (dist === 'nesting' ? 2.2 : 1.2),
        color: STATUS_COLOR[st] || colorOf[types.find(t => filters.types.has(t))] || '#cbd5e1',
        label: `<b>${esc(types.join(', ') || 'no type')}</b>${dirText ? '<br>' + dirText : ''}${r.tags?.length ? '<br>' + esc(r.tags.join(', ')) : ''}<br>${esc(facts.join(' · '))}${titles.length ? '<br>' + titles.join('<br>') : ''}`
      });
    }
    for (const l of links) { nodes.get(l.source).deg++; nodes.get(l.target).deg++; }

    // Group bonds (spec §4.1): a faint ring of links between the members of a group that relates as one unit.
    if ($('showBonds').checked) {
      for (const g of doc.groups) {
        if (!g.types?.length || !filters.groups.has(g.id)) continue;
        const st = P.statusAt(g, d);
        if (!st || !filters.status.has(st)) continue;
        const ms = P.membersAt(g, d).filter(m => nodes.has(m));
        for (let i = 0; i < ms.length; i++) for (let j = i + 1; j < ms.length; j++)
          links.push({ source: ms[i], target: ms[j], bond: g, width: 0.4, color: groupColor[g.id],
            label: `<b>${esc(g.name)}</b><br>${esc(P.typesAt(g, d).join(', '))} · ${esc(st)}` });
      }
    }

    if ($('showMeta').checked) {
      const partners = {};
      for (const l of links) if (l.rel) { (partners[l.source] ||= new Set()).add(l.target); (partners[l.target] ||= new Set()).add(l.source); }
      const linked = new Set(links.filter(l => l.rel).map(l => [l.source, l.target].sort().join('|')));
      const seen = new Set();
      for (const [hinge, ps] of Object.entries(partners)) {
        const arr = [...ps];
        for (let i = 0; i < arr.length; i++) for (let j = i + 1; j < arr.length; j++) {
          const k = [arr[i], arr[j]].sort().join('|');
          if (linked.has(k) || seen.has(k)) continue;
          seen.add(k);
          links.push({ source: arr[i], target: arr[j], meta: true, width: 0.3, color: '#6b7280', label: `metamours via ${esc(nodes.get(hinge).label)}` });
        }
      }
    }

    let nodeList = [...nodes.values()];
    if ($('hideIsolated').checked) nodeList = nodeList.filter(n => links.some(l => l.rel && (l.source === n.id || l.target === n.id)));
    const keep = new Set(nodeList.map(n => n.id));
    Graph.graphData({ nodes: nodeList, links: links.filter(l => keep.has(l.source) && keep.has(l.target)) });
  }

  function focusNode(n) {
    const dist = 90, r = 1 + dist / Math.hypot(n.x, n.y, n.z || 1);
    Graph.cameraPosition({ x: n.x * r, y: n.y * r, z: n.z * r }, n, 800);
    const p = n.person;
    const d = $('useDate').checked ? dates[+$('dateRange').value] : null;
    const rels = Graph.graphData().links.filter(l => l.rel && (l.source.id === n.id || l.target.id === n.id));
    const groups = doc.groups.filter(g => P.membersAt(g, d).includes(p.id));
    const style = P.styleOf(doc, p.id);
    $('info').innerHTML = `<h3>${esc(n.label)}</h3>
      <div class="note">${esc([p.pronouns, p.location, style].filter(Boolean).join(' · '))}</div>
      ${groups.length ? `<div>Groups: ${groups.map(g => esc(g.name) + (g.types?.length ? ` (${esc(P.typesAt(g, d).join(', '))})` : '')).join(', ')}</div>` : ''}
      ${p.tags?.length ? `<div class="note">Tags: ${esc(p.tags.join(', '))}</div>` : ''}
      <ul>${rels.map(l => { const o = l.source.id === n.id ? l.target : l.source; return l.hidden ? `<li>${esc(o.label)}: <span class="note">details hidden</span></li>` : `<li>${esc(o.label)}: ${esc(l.types.join(', ') || 'no type')} (${esc(l.status)})</li>`; }).join('') || '<li>No visible relationships</li>'}</ul>`;
    $('info').style.display = 'block';
  }

  function showLink(l) {
    if (l.meta) return;
    if (l.hidden) { $('info').innerHTML = `<h3>${esc(l.source.label)} &amp; ${esc(l.target.label)}</h3><div class="note">Details hidden (camera obscura).</div>`; $('info').style.display = 'block'; return; }
    const b = l.rel || l.bond;
    const title = l.rel ? `${esc(l.source.label)} &amp; ${esc(l.target.label)}` : esc(l.bond.name);
    const agreements = (b.agreements || []).map(a => `<li>${esc(a.text)}${a.since ? ` <span class="note">(since ${esc(a.since)})</span>` : ''}</li>`).join('');
    $('info').innerHTML = `<h3>${title}</h3><div>${l.label}</div>${b.since ? `<div class="note">Since ${esc(b.since)}</div>` : ''}${agreements ? `<div>Agreements:</div><ul>${agreements}</ul>` : ''}`;
    $('info').style.display = 'block';
  }

  function readFile(f) {
    const fr = new FileReader();
    fr.onload = () => { try { load(JSON.parse(fr.result)); } catch (e) { $('err').textContent = 'Could not parse JSON: ' + e.message; } };
    fr.readAsText(f);
  }

  $('fileIn').onchange = e => e.target.files[0] && readFile(e.target.files[0]);
  $('sampleBtn').onclick = () => fetch('sample.polyml.json').then(r => r.json()).then(load).catch(e => $('err').textContent = 'Could not load sample: ' + e.message);
  $('fitBtn').onclick = () => Graph.zoomToFit(600, 40);
  for (const id of ['useDate', 'showMeta', 'showBonds', 'hideIsolated']) $(id).onchange = refresh;
  $('dateRange').oninput = refresh;
  $('search').oninput = refresh;
  const g = $('graph');
  g.addEventListener('dragover', e => { e.preventDefault(); $('drop').style.display = 'flex'; });
  g.addEventListener('dragleave', e => { if (e.target === $('drop')) $('drop').style.display = 'none'; });
  g.addEventListener('drop', e => { e.preventDefault(); $('drop').style.display = 'none'; e.dataTransfer.files[0] && readFile(e.dataTransfer.files[0]); });

  // A file handed over from the builder opens directly; otherwise show the sample.
  let handoff = null;
  try { handoff = sessionStorage.getItem('polyml:handoff'); } catch (e) { /* storage unavailable */ }
  if (handoff) { try { load(JSON.parse(handoff)); } catch (e) { $('sampleBtn').click(); } }
  else $('sampleBtn').click();
})();
</script>
</body>
</html>
