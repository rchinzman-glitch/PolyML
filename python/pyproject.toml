[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polyml"
version = "0.3.0.dev0"
description = "Reference library and CLI for the polyML relationship network format"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
polyml = "polyml.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/polyml"]
