[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polyml"
version = "0.1.0.dev0"
description = "Reference library and CLI for the polyML relationship-network format"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
dev = ["pytest>=7", "pyyaml>=6"]

[project.scripts]
polyml = "polyml.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/polyml"]
